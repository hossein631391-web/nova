<!doctype html>

  <title>انجمن نجوم و فناوری‌های فضایی NOVA</title>
  <meta name="description" content="انجمن نجوم و فناوری‌های فضایی NOVA؛ رصد، آموزش و کشف جهان بی‌کران.">
  <script>
    (function () {
      var r = document.documentElement;
      r.classList.add("js");
      try {
        var t = localStorage.getItem("nova-theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        r.setAttribute("data-theme", t);
      } catch (e) { r.setAttribute("data-theme", "dark"); }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
